# Sign-in is Hermes's own (catalog rule 11): `hermes auth add slopcannon:slop` in a terminal. Hermes keeps
# the grant; the plugin only asks Hermes to mint short-lived agent sessions with it.
oauth:
  - id: slop
    authorize_url: https://slop.cc/oauth/authorize
    token_url: https://slop.cc/api/oauth/token
    scopes:
      - projects:read
      - projects:write
      - assets:read
      - assets:write
      - quotes:create
      - generations:create
      - generations:read
      - billing:read
    client_id_env: SLOPCANNON_OAUTH_CLIENT_ID
    hosts: [api.slop.cc]
# optional_env, not requires_env: a missing value must not disable the plugin for people who use a
# personal token instead of the Hermes sign-in.
optional_env:
  - name: SLOPCANNON_OAUTH_CLIENT_ID
    description: "slop.cc's public OAuth client id for Hermes: set it to hermes-agent (`hermes config set SLOPCANNON_OAUTH_CLIENT_ID hermes-agent`), then run `hermes auth add slopcannon:slop`. Not a secret. Not needed with a personal Agent token."
    url: "https://slop.cc/for-agents"
    password: false
config_schema:
  agent_token:
    type: secret
    env: SLOPCANNON_AGENT_TOKEN
    label: "Agent token"
    description: "Optional: a personal SLOPCANNON token from slop.cc/account (Agent access). Not needed after `hermes auth add slopcannon:slop`; required when api_origin is not https://api.slop.cc."
  api_origin:
    type: str
    default: "https://api.slop.cc"
    description: "SLOPCANNON API origin (HTTPS, or loopback HTTP for local development)."
  download_dir:
    type: str
    default: ""
    description: "Where clips and masters are saved. Empty means <hermes home>/cache/videos/slopcannon."
  max_credits_per_action:
    type: int
    default: 0
    description: "Hard ceiling in Cannon Credits for any one spending call; above it the call is blocked before the approval prompt. 0 means no ceiling."
  auto_approve_max_credits:
    type: int
    default: 0
    description: "When approvals are bypassed (YOLO / approvals.mode off), spending calls at or under this many credits proceed; anything larger is blocked. 0 blocks every unattended spend."
